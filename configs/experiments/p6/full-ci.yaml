schema_version: p6-full-v1
protocol_version: p6-protocol-v1
profile: qualification
device: cpu
seeds: [7]
train_samples: 64
validation_samples: 32
analysis_samples: 32
test_samples: 32
ood_samples: 32
batch_size: 8
steps_per_task: 2
validation_interval: 2
checkpoint_interval: 2
patience: 30
bootstrap_samples: 200
wall_clock_hours: 2
baseline_learning_rates:
  shared-gru: 0.0003
  shared-transformer: 0.0003
weight_decay: 0.01
gradient_clip_norm: 1.0
telemetry_enabled: false
output_root: artifacts/runs
control_root: artifacts/p6-cpu/control
